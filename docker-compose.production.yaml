# Production stack (docs/deployment.md). Standalone — never merged with the local file:
#
#   docker compose -f docker-compose.production.yaml up -d --build
#
# Caddy is the only service with published ports; api, worker, web and pg are reachable
# on the compose network alone. Secrets come from `.env` next to this file.

services:
  caddy:
    image: caddy:2-alpine
    container_name: sightread-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Both are read by the Caddyfile; see the production block of .env.example.
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  pg:
    image: postgres:16
    container_name: sightread-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sightread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sightread}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sightread} -d ${POSTGRES_DB:-sightread}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: sightread-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      UPLOAD_DIR: /data/uploads
      FIGURES_DIR: /data/figures
      WORKSPACES_DIR: /data/workspaces
      # uvicorn takes the client's address from the X-Forwarded-For Caddy sets — what the
      # operator console's audit log records. Safe only because nothing but the compose
      # network reaches api (docs/deployment.md § Compose files).
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - figures:/data/figures
      # Every user's files and revisions — primary data, bind-mounted at the same host
      # path the sandbox runner hands to `docker run` (docs/workspace.md).
      - ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}:/data/workspaces
    # Migrations run once, from the api container, before it serves (docs/database.md).
    command: >
      sh -c "alembic upgrade head &&
      uvicorn sightread.main:app --host 0.0.0.0 --port 8000"
    # Healthy only once /healthz answers — which is only after `alembic upgrade head`
    # finished and uvicorn is serving. The worker gates on this, so it can never claim a
    # queued job against a schema the migration has not written yet.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build:
      context: ./apps/api
    container_name: sightread-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      UPLOAD_DIR: /data/uploads
      FIGURES_DIR: /data/figures
      WORKSPACES_DIR: /data/workspaces
      # Where the worker writes the sandbox's sites for the egress proxy, which mounts the
      # same volume read-only (docs/sandbox.md § Network).
      SANDBOX_EGRESS_HOSTS_FILE: /data/sandbox-egress/hosts
    depends_on:
      pg:
        condition: service_healthy
      # service_healthy, not service_started: started only means the container exists,
      # and a worker that claims a job mid-migration bills the user and then fails on
      # the missing column.
      api:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - figures:/data/figures
      - ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}:/data/workspaces
      - sandbox_egress:/data/sandbox-egress
    command: ["python", "-m", "sightread.worker"]

  # The sandbox runner (docs/sandbox.md): alone in holding the Docker socket, it starts
  # one Kata microVM per user from the sandbox image (`docker build -t sightread-sandbox
  # deploy/sandbox-image`). The host needs /dev/kvm and the `kata` runtime registered with
  # Docker; the runner refuses to start in production with `runc`.
  sandbox:
    build:
      context: ./apps/sandbox
    # Named explicitly: compose would otherwise tag this build `sightread-sandbox`, the
    # tag the VM image (deploy/sandbox-image, SANDBOX_IMAGE) is documented to carry.
    image: sightread-sandbox-runner
    container_name: sightread-sandbox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      SANDBOX_BACKEND: docker
      SANDBOX_WORKSPACES_MOUNT: /data/workspaces
      # The egress proxy as a VM reaches it — by address, since Docker's DNS does not
      # answer inside a Kata VM — once SANDBOX_NETWORK names its network
      # (docs/sandbox.md § Network).
      SANDBOX_PROXY_URL: http://${SANDBOX_EGRESS_ADDRESS:-10.250.250.2}:${SANDBOX_EGRESS_PORT:-3128}
      SANDBOX_WORKSPACES_DIR: ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}:/data/workspaces
    healthcheck:
      # Probes the port the runner listens on (SANDBOX_PORT, read from the container's
      # own environment), never a fixed one (docs/deployment.md).
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('SANDBOX_PORT', '8100') + '/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The VMs' one way out (docs/sandbox.md § Network): a CONNECT proxy to the sites the
  # worker writes into the volume they share. The runner's image without its socket, its
  # `.env` or a place on the default network: nothing of the service is reachable from it.
  sandbox-egress:
    build:
      context: ./apps/sandbox
    image: sightread-sandbox-runner
    container_name: sightread-sandbox-egress
    restart: unless-stopped
    command: ["python", "-m", "sightread_sandbox.egress"]
    # tini as pid 1: as pid 1 itself, Python would ignore docker stop's SIGTERM.
    init: true
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_EGRESS_PORT: ${SANDBOX_EGRESS_PORT:-3128}
      SANDBOX_EGRESS_HOSTS_FILE: /data/sandbox-egress/hosts
      SANDBOX_EGRESS_CONNECT_TIMEOUT_SECONDS: ${SANDBOX_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      SANDBOX_EGRESS_IDLE_SECONDS: ${SANDBOX_EGRESS_IDLE_SECONDS:-300}
      SANDBOX_EGRESS_MAX_TUNNELS: ${SANDBOX_EGRESS_MAX_TUNNELS:-64}
    volumes:
      - sandbox_egress:/data/sandbox-egress:ro
    networks:
      sandbox:
        ipv4_address: ${SANDBOX_EGRESS_ADDRESS:-10.250.250.2}
      egress:
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['SANDBOX_EGRESS_PORT'])), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        # The public pages are prerendered by the build, so their absolute links, robots.txt
        # and the sitemap take the origin here (docs/web.md § Search engines). A changed
        # WEB_URL needs the image rebuilt.
        WEB_URL: ${WEB_URL:?WEB_URL is required}
    container_name: sightread-web
    restart: unless-stopped
    depends_on:
      - api

  backup:
    # Leaving a managed platform means backups are ours (docs/deployment.md). One pass a
    # day into ./backups — the database dump plus an archive of the stored figure crops,
    # which are durable result data a restored database cannot recreate — keeping the
    # newest seven of each. Deliberately a visible shell loop: a cron container would hide
    # the schedule and the rotation in two more places.
    image: postgres:16
    container_name: sightread-backup
    restart: unless-stopped
    environment:
      PGUSER: ${POSTGRES_USER:-sightread}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-sightread}
      PGHOST: pg
      # How long a pass waits for unconfirmed shell commands to clear before archiving
      # regardless (docs/workspace.md § Backups).
      BACKUP_WRITING_WAIT_SECONDS: ${BACKUP_WRITING_WAIT_SECONDS:-3600}
    volumes:
      - ./backups:/backups
      - figures:/data/figures:ro
      # The tree read-only; `.repos` writable for the backup lock alone, which every
      # workspace write takes shared (docs/workspace.md § Backups).
      - ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}:/data/workspaces:ro
      - ${WORKSPACES_HOST_DIR:?WORKSPACES_HOST_DIR is required}/.repos:/data/workspaces/.repos
    depends_on:
      pg:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          # The dump and the crops behind its results are one backup: both are written as
          # temporaries and published together only when both succeeded, so the newest
          # dump always has a same-stamp figures archive to restore beside it.
          # The workspaces (every user's edits, notes and originals) are primary data
          # from the chat agent on (docs/workspace.md § Backups) and ride the same stamp,
          # all but each user's own `.cache` — packages and shell state an install makes
          # again — matched at that one depth, never a folder of that name in the files.
          # One snapshot: the workspace backup lock is held exclusively from the dump to
          # the end of the archive, and every workspace write takes it shared, so no
          # rename, save or shell commit lands between the rows and the tree.
          mkdir -p /data/workspaces/.repos
          # A `.repos/<user>.writing` marker names a shell command nobody could confirm
          # over: that VM may still be writing into its tree, and an archive taken now
          # would hold files mid-write. The pass waits for the markers to clear, up to
          # BACKUP_WRITING_WAIT_SECONDS, then archives regardless — a late backup beats
          # none — and names the users it could not quiesce in the stamp's
          # unconfirmed-writes.txt (docs/workspace.md § Backups).
          waited=0
          while ls /data/workspaces/.repos/*.writing >/dev/null 2>&1 && [ "$$waited" -lt "$$BACKUP_WRITING_WAIT_SECONDS" ]; do
            echo "backup: an unconfirmed shell command stands; waiting ($$waited s so far)"
            sleep 60
            waited=$$((waited + 60))
          done
          # Written into a staging directory and published by one rename: a stamp
          # directory under /backups is complete by construction, never a dump without
          # its figures or workspaces archive, whatever stops the host in between.
          staging="/backups/.tmp-$$stamp"
          rm -rf "$$staging" && mkdir -p "$$staging"
          if flock -x /data/workspaces/.repos/backup.lock sh -c '
            pg_dump --format=custom --file="'"$$staging"'/sightread.dump" &&
            tar -czf "'"$$staging"'/figures.tar.gz" -C /data figures &&
            tar -czf "'"$$staging"'/workspaces.tar.gz" -C /data \
              --exclude="workspaces/.repos/*.lock" \
              --anchored --no-wildcards-match-slash --exclude="workspaces/*/.cache" \
              workspaces &&
            { ls /data/workspaces/.repos/*.writing 2>/dev/null | sed "s#.*/##" > "'"$$staging"'/unconfirmed-writes.txt";
              [ -s "'"$$staging"'/unconfirmed-writes.txt" ] || rm -f "'"$$staging"'/unconfirmed-writes.txt"; }'; then
            mv "$$staging" "/backups/$$stamp"
            echo "backup: published /backups/$$stamp (dump + figures + workspaces)"
          else
            rm -rf "$$staging"
            echo "backup: failed at $$stamp, nothing published" >&2
          fi
          # Keep the newest seven stamps; anything older is deleted whole.
          ls -1dt /backups/[0-9]*/ 2>/dev/null | tail -n +8 | while read -r old; do
            rm -rf "$$old"
            echo "backup: rotated out $$old"
          done
          sleep 86400
        done

networks:
  # Where the VMs are once SANDBOX_NETWORK names it: internal, so Docker routes nothing
  # off it; no address of the host's on it, so nothing the host listens on is reachable
  # from a VM; the egress proxy on it at a fixed address, outside the range the VMs'
  # addresses come from, so a VM started while the proxy restarts cannot take it
  # (docs/sandbox.md § Network). The runner refuses a network without the first two.
  sandbox:
    name: sightread-sandbox
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-10.250.250.0/24}
          ip_range: ${SANDBOX_VM_RANGE:-10.250.250.128/25}
  # The proxy's way out, its own.
  egress:

volumes:
  pgdata:
  uploads:
  figures:
  caddy_data:
  caddy_config:
  sandbox_egress:
