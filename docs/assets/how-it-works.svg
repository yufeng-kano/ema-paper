<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #475569; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
      .code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0369a1; }
      @media (prefers-color-scheme: dark) {
        .bg-card { fill: #1e293b !important; stroke: #334155 !important; }
        .title { fill: #f8fafc !important; }
        .desc { fill: #94a3b8 !important; }
        .arrow { stroke: #64748b !important; fill: #64748b !important; }
        .code { fill: #38bdf8 !important; }
        .inner-box { fill: #0f172a !important; stroke: #334155 !important; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" class="arrow" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Step 1: Input -->
  <g transform="translate(20, 20)">
    <rect class="bg-card" width="180" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="180" height="34" rx="10" fill="#17607d" />
    <rect y="24" width="180" height="10" fill="#17607d" />
    <text x="90" y="22" text-anchor="middle" fill="#ffffff" class="tag">1. INPUT DOCUMENTS</text>

    <g transform="translate(15, 52)">
      <rect class="inner-box" width="150" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">PDF Files</text>
      <text x="12" y="35" class="desc">Multi-page, complex layout</text>
    </g>
    <g transform="translate(15, 102)">
      <rect class="inner-box" width="150" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">Scanned Docs</text>
      <text x="12" y="35" class="desc">Tables, forms, receipts</text>
    </g>
    <g transform="translate(15, 152)">
      <rect class="inner-box" width="150" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">Raw Images</text>
      <text x="12" y="35" class="desc">PNG, JPG, WebP, HEIC</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="125" x2="235" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Ema Paper Processing Core -->
  <g transform="translate(245, 20)">
    <rect class="bg-card" width="220" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="220" height="34" rx="10" fill="#17607d" />
    <rect y="24" width="220" height="10" fill="#17607d" />
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" class="tag">2. SIGHTREAD ENGINE</text>

    <g transform="translate(15, 52)">
      <rect class="inner-box" width="190" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">Poppler Rendering</text>
      <text x="12" y="35" class="desc">Isolated CLI subprocesses</text>
    </g>
    <g transform="translate(15, 102)">
      <rect class="inner-box" width="190" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">BYO Vision Model</text>
      <text x="12" y="35" class="desc">Kano Proxy / Custom API</text>
    </g>
    <g transform="translate(15, 152)">
      <rect class="inner-box" width="190" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">PostgreSQL Queue</text>
      <text x="12" y="35" class="desc">SKIP LOCKED concurrency</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="470" y1="125" x2="500" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: Output Contract -->
  <g transform="translate(510, 20)">
    <rect class="bg-card" width="200" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="200" height="34" rx="10" fill="#0284c7" />
    <rect y="24" width="200" height="10" fill="#0284c7" />
    <text x="100" y="22" text-anchor="middle" fill="#ffffff" class="tag">3. STRUCTURED OUTPUT</text>

    <g transform="translate(15, 52)">
      <rect class="inner-box" width="170" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="22" class="title">Clean Markdown</text>
      <text x="12" y="35" class="desc">Tables, formulas, headings</text>
    </g>
    <g transform="translate(15, 102)">
      <rect class="inner-box" width="170" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="20" class="title">Page Markers</text>
      <text x="12" y="35" class="code">&lt;!-- page: N --&gt;</text>
    </g>
    <g transform="translate(15, 152)">
      <rect class="inner-box" width="170" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="12" y="20" class="title">Figure Coordinates</text>
      <text x="12" y="35" class="code">sightread://p{n}/{bbox}</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="715" y1="125" x2="745" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4: Consumers -->
  <g transform="translate(755, 20)">
    <rect class="bg-card" width="145" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <rect width="145" height="34" rx="10" fill="#059669" />
    <rect y="24" width="145" height="10" fill="#059669" />
    <text x="72" y="22" text-anchor="middle" fill="#ffffff" class="tag">4. CONSUMERS</text>

    <g transform="translate(12, 52)">
      <rect class="inner-box" width="121" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="10" y="22" class="title">REST &amp; SSE</text>
      <text x="10" y="35" class="desc">Data plane API</text>
    </g>
    <g transform="translate(12, 102)">
      <rect class="inner-box" width="121" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="10" y="22" class="title">Claude MCP</text>
      <text x="10" y="35" class="desc">Direct AI tooling</text>
    </g>
    <g transform="translate(12, 152)">
      <rect class="inner-box" width="121" height="42" rx="6" fill="#ffffff" stroke="#e2e8f0" />
      <text x="10" y="22" class="title">Web Workspace</text>
      <text x="10" y="35" class="desc">Graphite UI</text>
    </g>
  </g>
</svg>
