# Local full stack (docs/deployment.md). Plain HTTP, ports exposed on localhost.
#
# Containers are named rather than left to compose's generated `<project>-<service>-1`, so
# `docker logs -f sightread-worker` is the same command here as in production. The names are
# the same in both stacks, which is also why only one of them can be up at a time
# (docs/deployment.md § Compose files).

services:
  pg:
    image: postgres:16
    container_name: sightread-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sightread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sightread}
      POSTGRES_DB: ${POSTGRES_DB:-sightread}
    ports:
      # PG_PORT moves the host-side port when 5432 is already taken locally.
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sightread} -d ${POSTGRES_DB:-sightread}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: sightread-api
    env_file:
      - path: .env
        required: false
    environment:
      UPLOAD_DIR: /data/uploads
      FIGURES_DIR: /data/figures
      WORKSPACES_DIR: /data/workspaces
      # The runner's address, from the port it listens on (SANDBOX_PORT) — unless .env sets
      # SANDBOX_URL itself, an empty one included, which disables the sandbox
      # (docs/deployment.md): `-`, not `:-`, so only an unset variable takes the default.
      SANDBOX_URL: ${SANDBOX_URL-http://sandbox:${SANDBOX_PORT:-8100}}
    depends_on:
      pg:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
      - figures:/data/figures
      # A bind mount, not a named volume: the sandbox runner hands the same host path to
      # `docker run` (docs/workspace.md, docs/sandbox.md).
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/data/workspaces
    command: >
      sh -c "alembic upgrade head &&
      uvicorn sightread.main:app --host 0.0.0.0 --port 8000"
    # Healthy only once /healthz answers, i.e. after migrations finished (the production
    # file explains why the worker gates on this).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    # Same image as the api; only the command differs (docs/project-structure.md).
    build:
      context: ./apps/api
    container_name: sightread-worker
    env_file:
      - path: .env
        required: false
    environment:
      UPLOAD_DIR: /data/uploads
      FIGURES_DIR: /data/figures
      WORKSPACES_DIR: /data/workspaces
      # The runner's address, from the port it listens on (SANDBOX_PORT) — unless .env sets
      # SANDBOX_URL itself, an empty one included, which disables the sandbox
      # (docs/deployment.md): `-`, not `:-`, so only an unset variable takes the default.
      SANDBOX_URL: ${SANDBOX_URL-http://sandbox:${SANDBOX_PORT:-8100}}
      # Where the worker writes the sandbox's sites for the egress proxy, which mounts the
      # same volume read-only (docs/sandbox.md § Network).
      SANDBOX_EGRESS_HOSTS_FILE: /data/sandbox-egress/hosts
    depends_on:
      pg:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - figures:/data/figures
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/data/workspaces
      - sandbox_egress:/data/sandbox-egress
    command: ["python", "-m", "sightread.worker"]

  # The sandbox runner (docs/sandbox.md): the one container with the Docker socket. It
  # starts a container per user from the sandbox image, so build that image first:
  # `docker build -t sightread-sandbox deploy/sandbox-image`. SANDBOX_RUNTIME=runc works
  # on a laptop without KVM and isolates nothing; production requires a VM runtime.
  sandbox:
    build:
      context: ./apps/sandbox
    # Named explicitly: compose would otherwise tag this build `sightread-sandbox`, the
    # tag the VM image (deploy/sandbox-image, SANDBOX_IMAGE) is documented to carry.
    image: sightread-sandbox-runner
    container_name: sightread-sandbox
    env_file:
      - path: .env
        required: false
    environment:
      SANDBOX_BACKEND: docker
      SANDBOX_WORKSPACES_MOUNT: /data/workspaces
      # The egress proxy as a VM reaches it — by address, since Docker's DNS does not
      # answer inside a Kata VM — once SANDBOX_NETWORK names its network
      # (docs/sandbox.md § Network).
      SANDBOX_PROXY_URL: http://${SANDBOX_EGRESS_ADDRESS:-10.250.250.2}:${SANDBOX_EGRESS_PORT:-3128}
      # The workspaces as the Docker daemon sees them: the same host path api and worker
      # mount, which must then be absolute (the runner refuses a relative one), or the
      # compose project's ./workspaces when nothing names one.
      SANDBOX_WORKSPACES_DIR: ${SANDBOX_WORKSPACES_DIR:-${WORKSPACES_HOST_DIR:-${PWD}/workspaces}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACES_HOST_DIR:-./workspaces}:/data/workspaces
    healthcheck:
      # Probes the port the runner listens on (SANDBOX_PORT, read from the container's
      # own environment), never a fixed one (docs/deployment.md).
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('SANDBOX_PORT', '8100') + '/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The VMs' one way out (docs/sandbox.md § Network): a CONNECT proxy to the sites the
  # worker writes into the volume they share. The runner's image without its socket, its
  # `.env` or a place on the default network: nothing of the service is reachable from it.
  sandbox-egress:
    build:
      context: ./apps/sandbox
    image: sightread-sandbox-runner
    container_name: sightread-sandbox-egress
    command: ["python", "-m", "sightread_sandbox.egress"]
    # tini as pid 1: as pid 1 itself, Python would ignore docker stop's SIGTERM.
    init: true
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_EGRESS_PORT: ${SANDBOX_EGRESS_PORT:-3128}
      SANDBOX_EGRESS_HOSTS_FILE: /data/sandbox-egress/hosts
      SANDBOX_EGRESS_CONNECT_TIMEOUT_SECONDS: ${SANDBOX_EGRESS_CONNECT_TIMEOUT_SECONDS:-10}
      SANDBOX_EGRESS_IDLE_SECONDS: ${SANDBOX_EGRESS_IDLE_SECONDS:-300}
      SANDBOX_EGRESS_MAX_TUNNELS: ${SANDBOX_EGRESS_MAX_TUNNELS:-64}
    volumes:
      - sandbox_egress:/data/sandbox-egress:ro
    networks:
      sandbox:
        ipv4_address: ${SANDBOX_EGRESS_ADDRESS:-10.250.250.2}
      egress:
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ['SANDBOX_EGRESS_PORT'])), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
    container_name: sightread-web
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # The web app only ever calls the API on its own origin; caddy provides that origin
  # locally exactly like production does — use http://localhost:8080 for the full stack.
  caddy:
    image: caddy:2
    container_name: sightread-caddy
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro

networks:
  # Where the VMs are once SANDBOX_NETWORK names it: internal, so Docker routes nothing
  # off it; no address of the host's on it, so nothing the host listens on is reachable
  # from a VM; the egress proxy on it at a fixed address, outside the range the VMs'
  # addresses come from, so a VM started while the proxy restarts cannot take it
  # (docs/sandbox.md § Network). The runner refuses a network without the first two.
  sandbox:
    name: sightread-sandbox
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: ${SANDBOX_SUBNET:-10.250.250.0/24}
          ip_range: ${SANDBOX_VM_RANGE:-10.250.250.128/25}
  # The proxy's way out, its own.
  egress:

volumes:
  pgdata:
  uploads:
  figures:
  sandbox_egress:
